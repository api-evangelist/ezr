credentials:
  self_service: false
  how_to_obtain: >-
    Contact EZR technical support / the account manager. The developer guide's onboarding
    steps are: request a merchant AppId and the interface request address, EZR then issues
    Token and AppSystem and enables interface permissions.
  test_credentials_published: false
  note: >-
    The provider's own Agent Skill (skills/ezr-common-infrastructure.md) says the same thing —
    "联系 EZR 技术支持获取以下信息" for AppId, Token, AppSystem and EncryptType. The one value
    that appears in the reference, AppId "ezr-test", is a documentation placeholder in the
    published example block, not a working credential, and is not usable without a Token.
test_data:
  test_cards: []
  test_accounts: []
  magic_values: []
  note: >-
    None published. This is a retail CRM, not a card acquirer — there are no test card numbers
    to publish — and no magic member/store/coupon identifiers are documented for the test host.
tooling:
  test_clocks: false
  fixtures: false
  event_triggers: false
  request_console: false
  note: >-
    The documentation site has no "try it" console. The published testing aid is a Postman
    screenshot in the developer guide showing how to form-encode the Args field, plus two
    downloadable sample projects (see packages/ezr-packages.yml).
sample_projects:
- language: csharp
  name: OpenApiDemo
  version: 1.0.1
  url: http://apidoc.ezrpro.com/OpenApiDemo-v1.0.1.zip
- language: java
  name: JavaOpenApiDemo
  version: 1.0.2
  url: http://apidoc.ezrpro.com/JavaOpenApiDemo-v1.0.2.zip
gaps:
- No self-service test credentials — the sandbox cannot be reached without a sales conversation.
- No published test data or simulation values.
- No way to trigger a push/callback for testing the webhook receiver.
