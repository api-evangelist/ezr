apis:
- name: EZR Open Platform
  description: >-
    The EZR 开放平台 integration surface — 236 documented interfaces across 11 business
    domains (base data, member master data, loyalty points, coupons, sales data, WeChat mall,
    external mall distribution, messaging, gift cards, third-party platform binding, and
    extension references). Every interface is an HTTPS POST to a verb-named route with an
    application/x-www-form-urlencoded envelope of AppId, Sign, Timestamp, AppSystem and Args,
    where Args is the business payload as a JSON string. Responses always return HTTP 200 and
    signal the real outcome in a numeric StatusCode. 31 of the interfaces are EZR-to-integrator
    push callbacks. No OpenAPI is published.
  humanURL: https://open.ezrpro.com/#/apiFile
  baseURL: https://open-tp.ezrpro.com
