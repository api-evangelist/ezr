push_errors:
  note: >-
    Errors EZR itself records when POSTing a push/callback to a subscriber, harvested from the
    ErrorParam block of the callback interface reference (7 of 236 interfaces carry one).
  source: https://open.ezrpro.com/api/Doc/
  entries:
  - code: '500'
    description: The request was canceled due to the configured HttpClient.Timeout of 3 seconds elapsing.
    remediation: 推送接口超时，联系数据接收方检查接口响应性能，3秒内无返回视为超时。 (Push timed out — the receiver must respond within 3s.)
  - code: '500'
    description: 'An error occurred while sending the request.'
    remediation: 请求接口出错，检查数据接收方应用响应情况。 (Send failed — check the receiving application.)
  - code: 其他（非200）
    description: 业务错误 (business error)
    remediation: 检查业务数据 (check the business data)
