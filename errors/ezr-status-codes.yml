format: proprietary
note: >-
  EZR does not use RFC 9457 problem+json. Every EZR Open Platform response — success or
  failure — returns the same signed JSON envelope with a numeric StatusCode; 200 means
  success and Status is also true. The published "Status Code规范" page groups codes into
  three classes: 200 = success; non-200 = caused by the client, safe to fix and retry;
  500 = server-side, do NOT retry immediately, back off first. Captured verbatim from the
  provider's own coding-conventions page (titles translated, codes and Chinese text kept).
envelope:
  transport_status: HTTP 200 is returned even for business failures
  fields:
  - {field: Status, type: bool, meaning: true = business call succeeded}
  - {field: StatusCode, type: int, meaning: the code below; 200 = success}
  - {field: Msg, type: string, meaning: human-readable message}
  - {field: Sign, type: string, meaning: response signature, verifiable by the client}
  - {field: Timestamp, type: string, meaning: yyyyMMddHHmmss}
  - {field: Result, type: object|array, meaning: business payload}
  retry_guidance: >-
    Codes other than 200 and 500 are client-caused — correct the request and retry. 500 is
    server-caused — wait before resending the identical request. Response signatures should
    not be verified when Status=false.
classes:
- {range: '200', class: success}
- {range: 'non-200 (3xx/4xx/1xxx/2xxx)', class: client-error, retry: after correcting the request}
- {range: '500', class: server-error, retry: after a back-off delay}
status_code_count: 24
status_codes:
- {code: 200, title: 调用成功, title_en: Call succeeded, class: success}
- {code: 303, title: 无效的json内容, title_en: Invalid JSON content, class: client-error}
- {code: 306, title: 传入参数格式校验失败, title_en: Parameter format validation failed, class: client-error}
- {code: 307, title: 请求的参数数据为空, title_en: Request parameter data is empty, class: client-error}
- code: 308
  title: 请求时间戳Timestamp已过期，服务端校验时间不可超过10分钟的范围
  title_en: Request Timestamp expired — the server rejects timestamps more than 10 minutes out
  class: client-error
  remediation: Resynchronise the client clock; Timestamp must be within a 10-minute window.
- code: 400
  title: 访问受限通常指不在IP白名单
  title_en: Access restricted — usually the caller is not on the IP allowlist
  class: client-error
  remediation: Register the calling IP with EZR; interfaces are enabled by default on grant but require IP allowlisting.
- code: 405
  title: 错误的签名请求
  title_en: Bad request signature
  class: client-error
  remediation: 'Recompute Sign as uppercase SHA1/MD5 over AppId={AppId}&Timestamp={Timestamp}&Token={Token}.'
- {code: 406, title: 请求数据验证失败, title_en: Request data validation failed, class: client-error}
- {code: 407, title: 访问频率过快, title_en: Request rate too high, class: client-error, remediation: Back off — the documented default is 10 concurrent requests per second per interface per AppSystem.}
- {code: 500, title: 服务器内部处理业务失败, title_en: Server-side business processing failure, class: server-error, remediation: Do not retry immediately; wait and resend the identical request.}
- {code: 1000, title: 请求AppId不正确, title_en: Incorrect AppId, class: client-error}
