source: https://open.ezrpro.com/#/apiFile/guide/00001
docs: https://open.ezrpro.com/#/apiFile/guide/00001
note: >-
  EZR publishes a named, addressable test environment and prints its hostname in both the
  developer guide and the Envs block of all 236 interface definitions served from
  https://open.ezrpro.com/api/Doc/{id}. What it does NOT publish is any way to obtain
  credentials for it: there are no test keys, no self-service sign-up, no magic test values,
  no fixture or trigger tooling, and no time simulation. The sandbox is real but gated behind
  the same account-manager provisioning as production.
separation:
  model: separate-host
  test_live_switch: base URL only — the same AppId/Token/AppSystem scheme applies in both
  key_prefixes: none published
  mode_flag: none — there is no live/test flag in the request envelope
environments:
- name: 测试环境 (test)
  role: sandbox
  https: https://open-q1.ezrpro.com
  http: null
  service: EZR Open Platform
