aid: ezr
name: EZR
description: 'EZR (上海驿氪 / Shanghai EasyRetailPro) is a Shanghai-based retail marketing
  technology company founded in 2015 that builds SCRM and new-retail CRM software for
  multi-store and chain brands. Its platform combines a Marketing Cloud and in-store CRM to
  deliver omnichannel member management, WeChat mini-program malls, guide (导购) distribution
  and full-staff sales tools, live-streaming commerce, points malls, and campaign automation.
  EZR serves 800+ brands across fashion, beauty, home goods, food, and pharmacy, and is backed
  by Tencent, JD.com, DCM, and Lenovo Star. The EZR Open Platform (开放平台) at
  open.ezrpro.com publishes a reference for 236 interfaces across 11 business domains —
  stores and staff, member master data, loyalty points, coupons, sales receipts, WeChat mall,
  gift cards, messaging and third-party platform binding — of which 31 are EZR-to-integrator
  push callbacks. Every interface is an HTTP POST with a form-encoded, SHA1/MD5-signed
  envelope carrying the business payload as a JSON string; there is no OpenAPI, no OAuth, no
  versioning scheme and no self-service onboarding. EZR does publish a packaged Agent Skill
  for generating integration code.'
