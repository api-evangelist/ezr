- name: EZR KOS Open Platform
  description: >-
    The KOS (Key Opinion Sales) open platform — EZR's separate integration surface for
    guide/associate-led social selling, documented in its own developer guide with its own
    hosts. It uses the same AppId / Sign / Timestamp / AppSystem signed-request scheme as the
    main Open Platform. EZR publishes the access model and request paths but no per-interface
    reference on the public portal.
