aid: ezr
name: EZR
description: 'EZR (上海驿氪 / Shanghai Yike Information Technology) is a Shanghai-based retail
  marketing technology company founded in 2015 that builds SCRM and new-retail CRM software
  for multi-store and chain brands. Its platform combines a Marketing Cloud and in-store
  CRM to deliver omnichannel member management, WeChat mini-program malls, guide (导购)
  distribution and full-staff sales tools, live-streaming commerce, points malls, and
  campaign automation. EZR serves 800+ brands across fashion, beauty, home goods, food,
  and pharmacy, and is backed by Tencent, JD.com, DCM, and Lenovo Star. The company
  advertises an open platform of 100+ APIs covering products, users, transactions, and
  marketing, though it publishes no public developer portal, OpenAPI, or API reference.'
