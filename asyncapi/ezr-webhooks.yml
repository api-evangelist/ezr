note: >-
  EZR publishes no AsyncAPI document. It does publish a real, documented push/callback
  (webhook) surface: 31 of the 236 interfaces in the EZR Open Platform reference are
  EZR-to-third-party pushes rather than third-party-to-EZR calls. The consumer supplies the
  receiving URL ("callback（调用方提供支持POST方式的接口地址）"); EZR POSTs the same signed
  form-encoded envelope it accepts on inbound calls. Captured as a Webhooks catalog, not an
  AsyncAPI spec — nothing was fabricated.
transport:
  protocol: HTTPS
  method: POST
  content_type: application/x-www-form-urlencoded
  encoding: UTF-8
  envelope: AppId + Sign + Timestamp + AppSystem + Args (identical to the inbound request envelope)
  subscriber_url: supplied by the integrator to EZR; there is no self-service subscription API
delivery:
  timeout_seconds: 3
  retries: 6
  retry_schedule: 3 retries at 30s intervals, then 3 retries at 20-minute intervals
  consumer_requirement: >-
    EZR requires the receiving system to handle concurrency idempotently
    ("第三方系统需做并发幂等处理") — the retry policy can redeliver the same event.
  source: https://open.ezrpro.com/#/apiFile/guide/00001
signature_verification:
  algorithm: SHA1 (default) or MD5-32, uppercase hex
  input: AppId={AppId}&Timestamp={Timestamp}&Token={Token} (params sorted alphabetically)
  note: EZR signs its pushes with the same algorithm; receivers should verify before processing.
